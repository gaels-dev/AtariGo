syntax = "proto3";

option csharp_namespace = "AtariGo.Contracts";

package atarigo.authentication.v1;

service Authentication {
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc RegisterAccount (RegisterAccountRequest) returns (RegisterAccountResponse);
}

message LoginRequest {
  string identifier = 1;
  string password = 2;
}

message LoginResponse {
  LoginResult result = 1;
  int32 user_id = 2;
  string user_name = 3;
  string session_token = 4;
}

enum LoginResult {
  LOGIN_RESULT_UNSPECIFIED = 0;
  LOGIN_RESULT_SUCCESS = 1;
  LOGIN_RESULT_USER_NOT_FOUND = 2;
  LOGIN_RESULT_INCORRECT_PASSWORD = 3;
  LOGIN_RESULT_ACCOUNT_RESTRICTED = 4;
}

message RegisterAccountRequest {
  string user_name = 1;
  string email = 2;
  string password = 3;
  string password_confirmation = 4;
  string confirmation_text = 5;
}

message RegisterAccountResponse {
  RegistrationResult result = 1;
}

enum RegistrationResult {
  REGISTRATION_RESULT_UNSPECIFIED = 0;
  REGISTRATION_RESULT_SUCCESS = 1;
  REGISTRATION_RESULT_USERNAME_TAKEN = 2;
  REGISTRATION_RESULT_EMAIL_TAKEN = 3;
  REGISTRATION_RESULT_ERROR = 4;
}
