syntax = "proto3";

option csharp_namespace = "AtariGo.Contracts";

package atarigo.authentication.v1;

service Authentication {
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc VerifyLoginCode (VerifyLoginCodeRequest) returns (LoginResponse);
  rpc ResendLoginCode (ResendLoginCodeRequest) returns (LoginResponse);
  rpc CancelLogin (CancelLoginRequest) returns (CancelLoginResponse);
}

message LoginRequest {
  string identifier = 1;
  string password = 2;
  string culture_name = 3;
}

message LoginResponse {
  LoginResult result = 1;
  int32 user_id = 2;
  string user_name = 3;
  string session_token = 4;
  string challenge_token = 5;
  string masked_email = 6;
  int64 code_expires_at_unix_seconds = 7;
  int64 retry_at_unix_seconds = 8;
  string restriction_reason = 9;
}

enum LoginResult {
  LOGIN_RESULT_UNSPECIFIED = 0;
  LOGIN_RESULT_SUCCESS = 1;
  LOGIN_RESULT_USER_NOT_FOUND = 2;
  LOGIN_RESULT_INCORRECT_PASSWORD = 3;
  LOGIN_RESULT_ACCOUNT_RESTRICTED = 4;
  LOGIN_RESULT_INVALID_CREDENTIALS = 5;
  LOGIN_RESULT_CHALLENGE_REQUIRED = 6;
  LOGIN_RESULT_INVALID_CODE = 7;
  LOGIN_RESULT_CODE_EXPIRED = 8;
  LOGIN_RESULT_INVALID_CHALLENGE = 9;
  LOGIN_RESULT_TEMPORARILY_LOCKED = 10;
  LOGIN_RESULT_DELIVERY_FAILED = 11;
  LOGIN_RESULT_RATE_LIMITED = 12;
  LOGIN_RESULT_UNAVAILABLE = 13;
  LOGIN_RESULT_UNCONFIRMED = 14;
  LOGIN_RESULT_ALREADY_SIGNED_IN = 15;
}

message VerifyLoginCodeRequest {
  string challenge_token = 1;
  string code = 2;
}

message ResendLoginCodeRequest {
  string challenge_token = 1;
  string culture_name = 2;
}

message CancelLoginRequest {
  string challenge_token = 1;
}

message CancelLoginResponse {}
