syntax = "proto3";

option csharp_namespace = "AtariGo.Contracts";

package atarigo.registration.v1;

service Registration {
  rpc RegisterAccount (RegisterAccountRequest) returns (RegisterAccountResponse);
}

message RegisterAccountRequest {
  string user_name = 1;
  string email = 2;
  string password = 3;
  string password_confirmation = 4;
  string confirmation_text = 5;
}

message RegisterAccountResponse {
  RegistrationResult result = 1;
}

enum RegistrationResult {
  REGISTRATION_RESULT_UNSPECIFIED = 0;
  REGISTRATION_RESULT_SUCCESS = 1;
  REGISTRATION_RESULT_USERNAME_TAKEN = 2;
  REGISTRATION_RESULT_EMAIL_TAKEN = 3;
  REGISTRATION_RESULT_ERROR = 4;
}
