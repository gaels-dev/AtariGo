syntax = "proto3";

option csharp_namespace = "AtariGo.Contracts";

package atarigo.credentials.v1;

service Credentials {
  rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordResponse);
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
  string confirmation = 3;
}

message ChangePasswordResponse {
  PasswordChangeStatus status = 1;
}

enum PasswordChangeStatus {
  PASSWORD_CHANGE_STATUS_UNSPECIFIED = 0;
  PASSWORD_CHANGE_STATUS_CHANGED = 1;
  PASSWORD_CHANGE_STATUS_INCORRECT_CURRENT_PASSWORD = 2;
  PASSWORD_CHANGE_STATUS_INVALID_NEW_PASSWORD = 3;
  PASSWORD_CHANGE_STATUS_CONFIRMATION_MISMATCH = 4;
  PASSWORD_CHANGE_STATUS_CREDENTIAL_CHANGED = 5;
  PASSWORD_CHANGE_STATUS_ACCOUNT_UNAVAILABLE = 6;
}
