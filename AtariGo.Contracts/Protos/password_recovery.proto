syntax = "proto3";

option csharp_namespace = "AtariGo.Contracts";

package atarigo.password_recovery.v1;

service PasswordRecovery {
  rpc RequestPasswordRecovery (PasswordRecoveryRequest) returns (PasswordRecoveryResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (PasswordRecoveryResponse);
}

message PasswordRecoveryRequest {
  string identifier = 1;
  string culture_name = 2;
}

message ResetPasswordRequest {
  string identifier = 1;
  string code = 2;
  string new_password = 3;
  string confirmation = 4;
}

message PasswordRecoveryResponse {
  RecoveryStatus status = 1;
}

enum RecoveryStatus {
  RECOVERY_STATUS_UNSPECIFIED = 0;
  RECOVERY_STATUS_ACCEPTED = 1;
  RECOVERY_STATUS_RESET = 2;
  RECOVERY_STATUS_INVALID_CODE = 3;
  RECOVERY_STATUS_INVALID_PASSWORD = 4;
  RECOVERY_STATUS_CONFIRMATION_MISMATCH = 5;
  RECOVERY_STATUS_RATE_LIMITED = 6;
  RECOVERY_STATUS_UNAVAILABLE = 7;
  RECOVERY_STATUS_DELIVERY_FAILED = 8;
  RECOVERY_STATUS_NOT_SAVED = 9;
}
